<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test target</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; }
  #sample-paragraph { padding: 12px; background: #f3f4f6; border-radius: 6px; font-size: 20px; }
  #input-box { display: block; width: 100%; box-sizing: border-box; min-height: 120px; margin: 12px 0; padding: 10px; font-size: 20px; }
  small { color: #666; }
</style>
</head>
<body>
<h1>Test target</h1>
<p><small>A stand-in for psssbtyping.com with the same element ids. Click the Dark bookmark on this page.</small></p>
<div id="sample-paragraph"></div>
<textarea id="input-box" placeholder="#input-box"></textarea>
<button id="next-segment-btn">Next</button>
<p><small id="log"></small></p>
<script>
  // Behaves like the real page as far as the bookmarklet can tell: Next swaps the text after a
  // short delay and is disabled on the last segment; the box counts input events like a React page.
  const SEGMENTS = ['ਪੰਜਾਬ ਦੀ ਧਰਤੀ ਉਪਜਾਊ ਹੈ।', 'ਸਾਡਾ ਪਿੰਡ ਨਦੀ ਦੇ ਕੰਢੇ ਹੈ।', 'The third segment.', 'The last segment.'];
  let i = 0, inputs = 0;
  const p = document.getElementById('sample-paragraph'), box = document.getElementById('input-box');
  const next = document.getElementById('next-segment-btn'), log = document.getElementById('log');
  const show = () => { p.textContent = SEGMENTS[i]; next.disabled = i === SEGMENTS.length - 1; };
  next.onclick = () => { if (i < SEGMENTS.length - 1) setTimeout(() => { i++; show(); }, 300); };
  box.addEventListener('input', () => { inputs++; log.textContent = `input events: ${inputs}, box length: ${box.value.length}`; });
  show();
</script>
</body>
</html>
